[project]
name = "master-agent"
version = "0.1.0"
description = "Master Agent — the orchestration layer between human intention and software execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.30",
    "sqlmodel>=0.0.21",
    # Universal Autonomous Desktop Executive: the Windows UI Automation
    # bridge (desktop/execution/uia_control.py) — pure-Python COM
    # marshaling to the same IUIAutomation interface a screen reader
    # uses, not a competing automation framework. Was already an
    # installed transitive dependency of `pycaw` (the voice extra) and
    # already in packaging/kalpavriksha.spec's hiddenimports; declared
    # directly here now that the Desktop Executive itself depends on it.
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.scripts]
kalpavriksha = "master_agent.launcher.main:main"
master-agent-demo = "master_agent.cli:main"

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "sounddevice>=0.5",
    "pycaw>=20240210; sys_platform == 'win32'",
]
ui = [
    "pywebview>=5.1",
]
browser = [
    "playwright>=1.55",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
packaging = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
